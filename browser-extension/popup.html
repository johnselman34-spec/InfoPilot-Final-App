<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>InfoJet Quick Search</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 380px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a0a28 0%, #0f0318 100%);
      color: #e2e8f0;
    }
    
    .header {
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
      padding: 15px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .header .subtitle {
      font-size: 0.75rem;
      opacity: 0.9;
      margin-top: 4px;
    }
    
    .container {
      padding: 15px;
    }
    
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    
    .search-input {
      flex: 1;
      padding: 12px;
      border: 2px solid rgba(124, 58, 237, 0.5);
      border-radius: 8px;
      background: rgba(30, 20, 50, 0.8);
      color: #e2e8f0;
      font-size: 0.95rem;
    }
    
    .search-input:focus {
      outline: none;
      border-color: #a855f7;
    }
    
    .search-btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s;
    }
    
    .search-btn:hover {
      transform: scale(1.05);
    }
    
    .protocols-section {
      margin-top: 15px;
    }
    
    .section-title {
      font-size: 0.85rem;
      color: #a78bfa;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .protocol-list {
      max-height: 200px;
      overflow-y: auto;
    }
    
    .protocol-item {
      background: rgba(30, 20, 50, 0.5);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .protocol-item:hover {
      border-color: #a855f7;
      background: rgba(124, 58, 237, 0.2);
    }
    
    .protocol-item.active {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
    }
    
    .protocol-name {
      font-weight: 600;
      color: #f472b6;
      font-size: 0.9rem;
    }
    
    .protocol-desc {
      font-size: 0.75rem;
      color: #71717a;
      margin-top: 4px;
    }
    
    .footer {
      padding: 15px;
      text-align: center;
      border-top: 1px solid rgba(124, 58, 237, 0.3);
    }
    
    .footer a {
      color: #a78bfa;
      text-decoration: none;
      font-size: 0.8rem;
    }
    
    .footer a:hover {
      color: #f472b6;
    }
    
    .login-prompt {
      text-align: center;
      padding: 30px 15px;
    }
    
    .login-btn {
      display: inline-block;
      padding: 12px 25px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      text-decoration: none;
      margin-top: 15px;
    }
    
    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      padding: 10px;
      background: rgba(30, 20, 50, 0.5);
      border-radius: 8px;
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: #10b981;
    }
    
    .stat-label {
      font-size: 0.7rem;
      color: #71717a;
    }
    
    .empty-state {
      text-align: center;
      padding: 20px;
      color: #71717a;
    }
    
    .settings-link {
      display: block;
      text-align: center;
      margin-top: 10px;
      font-size: 0.75rem;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🚀 InfoJet</h1>
    <div class="subtitle">Quick Search by InfoPilot Explorer</div>
  </div>
  
  <div class="container" id="main-content">
    <!-- Content loaded by popup.js -->
    <div class="search-box">
      <input type="text" class="search-input" id="search-input" placeholder="Search with InfoPilot..." autofocus>
      <button class="search-btn" id="search-btn">🔍</button>
    </div>
    
    <div class="protocols-section">
      <div class="section-title">📋 Quick Protocols</div>
      <div class="protocol-list" id="protocol-list">
        <div class="empty-state">Loading protocols...</div>
      </div>
    </div>
    
    <div class="stats" id="stats-section" style="display: none;">
      <div class="stat">
        <div class="stat-value" id="searches-count">0</div>
        <div class="stat-label">Searches</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="protocols-count">0</div>
        <div class="stat-label">Protocols</div>
      </div>
    </div>
  </div>
  
  <div class="footer">
    <a href="#" id="open-app">Open Full App</a>
    <a href="options.html" class="settings-link">⚙️ Settings</a>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
